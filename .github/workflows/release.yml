name: release

# A v* tag publishes prebuilt `kzig` CLIs. Cross-compiled on Linux; no
# Windows build (`kzig dev` and `start` are POSIX).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  kzig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: this job can write releases.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - name: Build
        run: |
          mkdir dist
          for target in x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos; do
            zig build -Doptimize=ReleaseSafe -Dtarget=$target "-Dversion=$GITHUB_REF_NAME" --prefix "out/$target"
            tar -czf "dist/kzig-$GITHUB_REF_NAME-$target.tar.gz" -C "out/$target/bin" kzig
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          ./out/x86_64-linux-musl/bin/kzig help > /dev/null
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag ||
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
