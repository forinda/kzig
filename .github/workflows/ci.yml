name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check build.zig build.zig.zon src examples tests benchmarks
      - run: zig build test -Dhttpz -Doptimize=${{ matrix.optimize }} --summary all
      - run: ./scripts/scaffold-check.sh
        if: matrix.optimize == 'Debug'

  # The S3 driver against a real S3 API (SeaweedFS checks SigV4 like AWS),
  # and kzig.db against Postgres.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Postgres with TLS: a throwaway CA and a certificate for localhost, so
      # the tests can check verify-full (and that every other test runs over
      # TLS, sslmode=prefer being the default).
      - name: Postgres with TLS
        run: |
          d="$RUNNER_TEMP/pg"; mkdir -p "$d"; cd "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout ca.key -out ca.pem -subj "/CN=kzig CI CA"
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost\n" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -out server.pem -extfile ext.cnf
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=kzig -e POSTGRES_PASSWORD=kzigpass -e POSTGRES_DB=kzig_test postgres:17-alpine
          for i in $(seq 60); do docker exec pg pg_isready -U kzig -h 127.0.0.1 >/dev/null 2>&1 && break; sleep 1; done
          docker cp server.pem pg:/var/lib/postgresql/server.pem
          docker cp server.key pg:/var/lib/postgresql/server.key
          docker exec pg sh -c 'chown postgres /var/lib/postgresql/server.*; chmod 600 /var/lib/postgresql/server.key'
          for q in "ALTER SYSTEM SET ssl = on" "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.pem'" "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'" "SELECT pg_reload_conf()"; do
            docker exec pg psql -U kzig -d kzig_test -qtAc "$q"
          done
          [ "$(docker exec pg psql -U kzig -d kzig_test -tAc 'SHOW ssl')" = on ]
      - name: S3 server
        run: |
          echo '{"identities":[{"name":"kzig","credentials":[{"accessKey":"kzigtest","secretKey":"kzigtestsecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name s3 -p 8333:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" chrislusf/seaweedfs:4.50 server -s3 -s3.config=/etc/s3.json
          for i in $(seq 60); do curl -s -o /dev/null localhost:8333/ && break; sleep 1; done
          ok=
          for i in $(seq 30); do
            if docker exec s3 sh -c 'echo "s3.bucket.create -name kzig-test" | weed shell' | grep -q "created bucket"; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs s3; exit 1; }
      - run: zig build test --summary all
        env:
          DATABASE_URL: postgres://kzig:kzigpass@localhost:5432/kzig_test
          PG_TEST_ROOTCERT: ${{ runner.temp }}/pg/ca.pem
          S3_TEST_ENDPOINT: http://localhost:8333
          S3_TEST_BUCKET: kzig-test
          S3_TEST_ACCESS_KEY_ID: kzigtest
          S3_TEST_SECRET_ACCESS_KEY: kzigtestsecret
      - run: ./scripts/scaffold-check.sh
        env:
          DATABASE_URL: postgres://kzig:kzigpass@localhost:5432/kzig_test
