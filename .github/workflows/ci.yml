name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check build.zig build.zig.zon src examples tests benchmarks
      - run: zig build test -Dhttpz -Doptimize=${{ matrix.optimize }} --summary all
      - run: ./scripts/scaffold-check.sh
        if: matrix.optimize == 'Debug'

  # The S3 driver against a real S3 API (SeaweedFS checks SigV4 like AWS),
  # and kzig.db against Postgres.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Postgres with TLS: a throwaway CA and a certificate for localhost, so
      # the tests can check verify-full (and that every other test runs over
      # TLS, sslmode=prefer being the default).
      - name: Postgres with TLS
        run: |
          d="$RUNNER_TEMP/pg"; mkdir -p "$d"; cd "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout ca.key -out ca.pem -subj "/CN=kzig CI CA"
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost\n" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -out server.pem -extfile ext.cnf
          # Client certificates for a `certuser` that signs in by certificate.
          for kind in ec rsa ed25519; do
            case $kind in
              ec) openssl ecparam -name prime256v1 -genkey -noout -out certuser-ec.key ;;
              rsa) openssl genrsa -traditional -out certuser-rsa.key 2048 ;;
              ed25519) openssl genpkey -algorithm ed25519 -out certuser-ed25519.key ;;
            esac
            openssl req -new -key certuser-$kind.key -out certuser-$kind.csr -subj "/CN=certuser"
            openssl x509 -req -in certuser-$kind.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -out certuser-$kind.pem
          done
          openssl pkcs8 -topk8 -in certuser-rsa.key -v2 aes-256-cbc -v2prf hmacWithSHA256 -passout pass:kzig-test -out certuser-rsa-enc.key
          # CRLs from the CA: none revoked, and one revoking the server's certificate.
          mkdir crldb; touch crldb/index.txt; echo 1000 > crldb/crlnumber
          printf '[ ca ]\ndefault_ca = ca\n[ ca ]\ndatabase = %s/crldb/index.txt\ncrlnumber = %s/crldb/crlnumber\ndefault_md = sha256\ndefault_crl_days = 2\ncertificate = %s/ca.pem\nprivate_key = %s/ca.key\n' "$d" "$d" "$d" "$d" > crldb/ca.cnf
          openssl ca -config crldb/ca.cnf -gencrl -out crl-empty.pem
          openssl ca -config crldb/ca.cnf -revoke server.pem
          openssl ca -config crldb/ca.cnf -gencrl -out crl-server-revoked.pem
          # pg: TLS 1.3 (the tests' server); pg12: TLS 1.2 only, for its client-certificate path.
          ready() { for i in $(seq 60); do docker exec $1 pg_isready -U kzig -h 127.0.0.1 >/dev/null 2>&1 && return 0; sleep 1; done; docker logs $1; return 1; }
          setup() {
            name=$1; port=$2; extra=$3
            docker run -d --name $name -p $port:5432 -e POSTGRES_USER=kzig -e POSTGRES_PASSWORD=kzigpass -e POSTGRES_DB=kzig_test postgres:17-alpine
            ready $name
            for f in server.pem server.key ca.pem; do docker cp $f $name:/var/lib/postgresql/$f; done
            docker exec $name sh -c 'chown postgres /var/lib/postgresql/*.pem /var/lib/postgresql/server.key; chmod 600 /var/lib/postgresql/server.key'
            for q in "ALTER SYSTEM SET ssl = on" "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.pem'" "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'" "ALTER SYSTEM SET ssl_ca_file = '/var/lib/postgresql/ca.pem'" "CREATE ROLE certuser LOGIN" ${extra:+"$extra"}; do
              docker exec $name psql -U kzig -d kzig_test -qtAc "$q"
            done
            hba=$(docker exec $name psql -U kzig -d kzig_test -tAc 'SHOW hba_file')
            docker exec $name sh -c "sed -i '1i hostssl all certuser all cert' $hba"
            # A restart, not a reload: SHOW ssl right after a reload can race it.
            docker restart $name >/dev/null
            ready $name
            [ "$(docker exec $name psql -U kzig -d kzig_test -tAc 'SHOW ssl')" = on ]
          }
          setup pg 5432 ""
          setup pg12 5433 "ALTER SYSTEM SET ssl_max_protocol_version = 'TLSv1.2'"
      - name: S3 server
        run: |
          echo '{"identities":[{"name":"kzig","credentials":[{"accessKey":"kzigtest","secretKey":"kzigtestsecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name s3 -p 8333:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" chrislusf/seaweedfs:4.50 server -s3 -s3.config=/etc/s3.json
          for i in $(seq 60); do curl -s -o /dev/null localhost:8333/ && break; sleep 1; done
          ok=
          for i in $(seq 30); do
            if docker exec s3 sh -c 'echo "s3.bucket.create -name kzig-test" | weed shell' | grep -q "created bucket"; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs s3; exit 1; }
      - run: zig build test --summary all
        env:
          DATABASE_URL: postgres://kzig:kzigpass@localhost:5432/kzig_test
          PG_TEST_ROOTCERT: ${{ runner.temp }}/pg/ca.pem
          PG_TEST_CERT_DIR: ${{ runner.temp }}/pg
          PG_TEST_TLS12_PORT: "5433"
          S3_TEST_ENDPOINT: http://localhost:8333
          S3_TEST_BUCKET: kzig-test
          S3_TEST_ACCESS_KEY_ID: kzigtest
          S3_TEST_SECRET_ACCESS_KEY: kzigtestsecret
      - run: ./scripts/scaffold-check.sh
        env:
          DATABASE_URL: postgres://kzig:kzigpass@localhost:5432/kzig_test
